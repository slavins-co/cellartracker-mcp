name: Publish

on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 20 ships npm 10.
      # With a trusted publisher configured on npmjs.com, npm authenticates
      # via the id-token above and ignores NODE_AUTH_TOKEN. The token stays
      # only as a fallback until the first OIDC publish succeeds.
      - run: npm install -g npm@11
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  desktop-extension:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
      - run: npm run build
      # scripts/pack-check.sh (shared with ci.yml's packaging-dry-run job)
      # re-installs production-only deps and packs, without publishing.
      - run: npm run pack:check
      - name: Attach .mcpb to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: "*.mcpb"
