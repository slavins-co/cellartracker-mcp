name: Publish to MCP Registry

# Republishes server.json to the official MCP Registry on each release, or
# manually for an existing tag. Runs alongside the Publish workflow and waits
# for npm to serve the version, since the registry verifies the npm package.
# Authenticates with GitHub Actions OIDC, so no interactive device login or
# stored token is needed. Both triggers need write access to the repo.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.5.1)"
        required: true

permissions:
  contents: read

jobs:
  publish-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC login to the registry
    env:
      MCP_PUBLISHER_VERSION: "1.8.1"
      MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
    steps:
      - uses: actions/checkout@v7
        with:
          # Release events check out the release tag by default.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install mcp-publisher (pinned, checksum-verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Wait for the npm version to be available
        # Publish runs in parallel, and npm can take a few minutes to serve a
        # just-published version. The registry rejects a server.json whose
        # package version it can't find. If npm publish fails, this times out.
        run: |
          VERSION=$(jq -r .version server.json)
          for i in $(seq 1 60); do
            if [ "$(npm view "cellartracker-mcp@${VERSION}" version 2>/dev/null)" = "${VERSION}" ]; then
              echo "npm serves ${VERSION}"; exit 0
            fi
            sleep 15
          done
          echo "cellartracker-mcp@${VERSION} not available on npm after 15 minutes" >&2
          exit 1

      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
